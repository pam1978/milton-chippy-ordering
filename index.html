<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Milton Chippy</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="hero">

    <div class="hero-overlay">

        <img src="images/logo.png" class="logo" alt="Milton Chippy">

        <h1>Milton Chippy</h1>

        <p class="tagline">
            Fresh Fish • Kebabs • Burgers • Gluten Free • Vegan
        </p>

        <p class="collection">
            Collection Only • Pay In Store
        </p>

        <button class="order-btn" onclick="showCategory('fish')">
            🍟 Start Your Order
        </button>

    </div>

</header>
<section class="specials-banner">

    <div class="specials-title">
        ⭐ TODAY'S SPECIALS
    </div>

    <p>
        Great value meal deals from Milton Chippy
    </p>

    <button onclick="showCategory('specials')">
        View Specials
    </button>

</section>
<div class="search-area">

<input
type="text"
id="search"
placeholder="🔍 Search the menu..."
onkeyup="searchMenu()">

</div>

<section id="categories">

<button onclick="showCategory('fish')">Fish</button>

<button onclick="showCategory('burgers')">Burgers</button>

<button onclick="showCategory('kebabs')">Kebabs</button>

<button onclick="showCategory('chicken')">Chicken</button>

<button onclick="showCategory('pies')">Pies</button>

<button onclick="showCategory('extras')">Extras</button>

<button onclick="showCategory('specials')">Specials</button>

<button onclick="showCategory('salad')">Salads</button>

<button onclick="showCategory('drinks')">Drinks</button>

<button onclick="showCategory('desserts')">Desserts</button>

<button onclick="showCategory('glutenfree')">Gluten Free</button>

<button onclick="showCategory('vegan')">Vegan</button>

</section>

<section id="menu">

<h2>Welcome</h2>

<p>Select a category above.</p>

</section>

<section id="basket">

<div id="basketSummary" onclick="openBasket()">

🛒 Basket:
<span id="basketCount">0</span>
Items |

£<span id="basketTotal">0.00</span>

</div>

<h2>Your Order</h2>

<div id="basketItems"></div>

<h3>

Total £<span id="total">0.00</span>

</h3>

<input
id="customerName"
type="text"
placeholder="Your Name">

<input
id="customerPhone"
type="tel"
placeholder="Phone Number">

<input
id="collectionTime"
type="time">

<textarea
id="notes"
placeholder="Order notes"></textarea>

<button id="checkout">

Place Order

</button>

</section>

<div id="popup" class="popup">

<div class="popup-content">

<h2>Choose Extras</h2>

<div id="popupOptions"></div>

<button onclick="closePopup()">

Done

</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script src="menu.js"></script>
<script src="script.js"></script>

</body>

</html>
