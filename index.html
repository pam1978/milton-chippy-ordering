<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Milton Chippy</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<!-- ========================================
     FLOATING BASKET BUTTON
======================================== -->

<button
    id="floatingBasket"
    onclick="toggleBasket()"
    type="button"
>

    🛒

    <span id="floatingBasketCount">
        0
    </span>

    <span class="floatingBasketPrice">
        £<span id="floatingBasketTotal">
            0.00
        </span>
    </span>

</button>


<!-- ========================================
     HERO
======================================== -->

<header class="hero">

    <div class="hero-overlay">

        <img
            src="images/logo.png"
            class="logo"
            alt="Milton Chippy"
        >

        <h1>
            Milton Chippy
        </h1>

        <p class="tagline">
            Fresh Fish • Kebabs • Burgers • Gluten Free • Vegan
        </p>

        <p class="collection">
            Collection Only • Pay In Store
        </p>

        <button
            class="order-btn"
            onclick="showCategory('fish')"
            type="button"
        >
            🍟 Start Your Order
        </button>

    </div>

</header>


<!-- ========================================
     SPECIALS
======================================== -->

<section class="specials-banner">

    <div class="specials-title">
        ⭐ TODAY'S SPECIALS
    </div>

    <p>
        Great value meal deals from Milton Chippy
    </p>

    <button
        onclick="showCategory('specials')"
        type="button"
    >
        View Specials
    </button>

</section>


<!-- ========================================
     SEARCH
======================================== -->

<div class="search-area">

    <input
        type="text"
        id="search"
        placeholder="🔍 Search the menu..."
        onkeyup="searchMenu()"
    >

</div>


<!-- ========================================
     CATEGORIES
======================================== -->

<section id="categories">

    <button
        onclick="showCategory('fish')"
        type="button"
    >
        Fish
    </button>

    <button
        onclick="showCategory('burgers')"
        type="button"
    >
        Burgers
    </button>

    <button
        onclick="showCategory('kebabs')"
        type="button"
    >
        Kebabs
    </button>

    <button
        onclick="showCategory('chicken')"
        type="button"
    >
        Chicken
    </button>

    <button
        onclick="showCategory('pies')"
        type="button"
    >
        Pies
    </button>

    <button
        onclick="showCategory('extras')"
        type="button"
    >
        Extras
    </button>

    <button
        onclick="showCategory('specials')"
        type="button"
    >
        ⭐ Specials
    </button>

    <button
        onclick="showCategory('salad')"
        type="button"
    >
        🥗 Salads
    </button>

    <button
        onclick="showCategory('drinks')"
        type="button"
    >
        🥤 Drinks
    </button>

    <button
        onclick="showCategory('desserts')"
        type="button"
    >
        Desserts
    </button>

    <button
        onclick="showCategory('glutenfree')"
        type="button"
    >
        Gluten Free
    </button>

    <button
        onclick="showCategory('vegan')"
        type="button"
    >
        Vegan
    </button>

</section>


<!-- ========================================
     MENU
======================================== -->

<section id="menu">

    <h2>
        Welcome
    </h2>

    <p>
        Select a category above.
    </p>

</section>


<!-- ========================================
     BASKET
======================================== -->

<section id="basket">

    <div id="basketSummary">

        🛒 Basket:

        <span id="basketCount">
            0
        </span>

        Items |

        £<span id="basketTotal">
            0.00
        </span>

    </div>


    <!-- CLOSE BUTTON -->

    <button
        class="basket-close"
        onclick="closeBasket()"
        type="button"
    >
        ✕ Close Basket
    </button>


    <h2>
        🛒 Your Order
    </h2>


    <!-- ORDER ITEMS -->

    <div id="basketItems"></div>


    <!-- TOTAL -->

    <h3>

        Total £<span id="total">
            0.00
        </span>

    </h3>


    <!-- CUSTOMER DETAILS -->

    <input
        id="customerName"
        type="text"
        placeholder="Your Name"
    >


    <input
        id="customerPhone"
        type="tel"
        placeholder="Phone Number"
    >


    <input
        id="collectionTime"
        type="time"
    >


    <textarea
        id="notes"
        placeholder="Order notes (optional)"
    ></textarea>


    <!-- CHECKOUT -->

    <button
        id="checkout"
        type="button"
    >
        Place Order
    </button>

</section>


<!-- ========================================
     EXTRAS POPUP
======================================== -->

<div
    id="popup"
    class="popup"
>

    <div class="popup-content">

        <h2>
            Choose Extras
        </h2>

        <div id="popupOptions"></div>

        <button
            onclick="closePopup()"
            type="button"
        >
            Done
        </button>

    </div>

</div>


<!-- ========================================
     CONFETTI
======================================== -->

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>


<!-- ========================================
     MENU DATA
======================================== -->

<script src="menu.js"></script>


<!-- ========================================
     MAIN JAVASCRIPT
======================================== -->

<script src="script.js"></script>


</body>

</html>
