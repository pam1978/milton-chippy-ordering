<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milton Chippy</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

 <header class="hero">

    <img src="images/logo.png" class="logo" alt="Milton Chippy Logo">

    <h1>Milton Chippy</h1>

    <p>Fresh Fish • Kebabs • Burgers • Gluten Free • Vegan</p>

    <div class="hero-buttons">
        <button onclick="showCategory('fish')">🍟 Order Now</button>
    </div>

</header>

<p>Open 7 Days a Week</p>

</header>

<section id="categories">
<button onclick="showCategory('fish')">Fish & Chips</button>
<button onclick="showCategory('burgers')">Burgers</button>
<button onclick="showCategory('kebabs')">Kebabs</button>
<button onclick="showCategory('chicken')">Chicken</button>
<button onclick="showCategory('pies')">Pies</button>
<button onclick="showCategory('extras')">Extras</button>
<button onclick="showCategory('desserts')">Desserts</button>
<button onclick="showCategory('glutenfree')">Gluten Free</button>
<button onclick="showCategory('vegan')">Vegan</button>
<button onclick="showCategory('drinks')">🥤 Drinks</button>
</section>
<input
id="search"
type="text"
placeholder="🔍 Search our menu..."
onkeyup="searchMenu()">
<section id="menu">
<h2>Welcome</h2>
<p>Please choose a category above.</p>
</section>

<section id="basket">
 <div id="basketSummary">
🛒 Basket: <span id="basketCount">0</span> items |
£<span id="basketTotal">0.00</span>
</div>
<h2>🛒 Your Order</h2>

<div id="basketItems"></div>

<h3>Total £<span id="total">0.00</span></h3>

<input id="customerName" type="text" placeholder="Your Name">
<input id="customerPhone" type="tel" placeholder="Phone Number">
<input id="collectionTime" type="time">

<textarea id="notes" placeholder="Order notes (optional)"></textarea>

<button id="checkout">Place Order</button>
</section>
<div id="popup" class="popup">

<div class="popup-content">

<h2>Choose Extras</h2>

<div id="popupOptions"></div>

<button onclick="closePopup()">Done</button>

</div>

</div>
<script src="menu.js"></script>
<script src="script.js"></script>

</body>
</html>
<button onclick="showCategory('specials')">⭐ Specials</button>

<button onclick="showCategory('salads')">🥗 Salads</button>
